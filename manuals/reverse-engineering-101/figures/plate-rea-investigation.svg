<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" role="img" aria-labelledby="plate-rea-investigation-title plate-rea-investigation-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="plate-rea-investigation-title">One function, four views</title>
  <desc id="plate-rea-investigation-desc">The recorded run of rea function on ledger-arm64-O1 for _percent_change with the Ghidra provider. At the top, you call rea 6.7.0, which hands the question to the BinarySession bound to ghidra, which calls the GhidraClient over bridge.sock, which launches Ghidra 12.1.4 as a headless JVM to import and analyze the artifact ledger-arm64-O1, a mach-o arm64 executable of 33872 bytes. Three columns show the same function: the C you wrote in ledger.c, the six instructions clang -O1 made from cbz w0 at 0x100000500 to ret at 0x100000514, and the pseudocode Ghidra decompiled with a second zero check the source never had. The Evidence record ev_b492c85e at the bottom names the operation analyze_function, the provider ghidra 12.1.4, the profile digest, confidence observed, the authority of a static read, ten limitations, and the subject sha256.</desc>
