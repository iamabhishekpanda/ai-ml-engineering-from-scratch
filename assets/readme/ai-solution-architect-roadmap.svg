<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="phase-roadmap-title phase-roadmap-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="phase-roadmap-title">AI Engineering Phase 0 to Phase 20 road map</title>
  <desc id="phase-roadmap-desc">An animated two-row road map for Phases 0 through 20. Blue marks foundations, amber marks learning systems, teal marks production systems, violet marks agent systems, and green marks the Azure AI Engineering destination. A moving marker travels the road and green ticks appear as each phase is completed.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .road-motion { display: none; }
      .road-tick { opacity: 1 !important; }
    }
  </style>
  <defs>
    <path id="phase-road" d="M 48 142 H 592 V 356 H 48" fill="none"/>
    <marker id="phase-road-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--m-blue-ink, #3553ff)"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="600" height="480" fill="var(--m-paper, #fafaf5)" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.5"/>
  <text x="40" y="50" font-size="12" letter-spacing="1.2" fill="var(--m-blue-ink, #3553ff)">FIG_008 · PHASE ROAD MAP</text>
  <text x="40" y="76" font-family="Source Serif 4, Georgia, serif" font-size="14">Build the foundations, follow the systems road, then deploy Azure AI.</text>

