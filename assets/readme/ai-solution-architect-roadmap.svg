  <path d="M 48 142 H 592 V 356 H 48" fill="none" stroke="var(--m-blue-ink, #3553ff)" stroke-width="1.2" stroke-dasharray="4 5" stroke-linejoin="round" marker-end="url(#phase-road-head)"/>

